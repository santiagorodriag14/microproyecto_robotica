; risky = firmware principal (Ubuntu); risky_manual = el mismo sin telemetría (Windows);
; bench_* = un banco de prueba por módulo.
; Ejemplo: pio run -e risky -t upload -t monitor

[platformio]
default_envs = risky

[env]
; Plataforma oficial = núcleo Arduino 2.0.x, el que soporta micro_ros_platformio.
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra
lib_deps = pololu/VL53L0X @ ^1.3.1
; RosLink necesita la librería de micro-ROS, que solo se instala en los entornos que extienden [microros].
lib_ignore = RosLink

; micro_ros_platformio no compila en Windows: los entornos que lo extienden se construyen en Ubuntu.
[microros]
lib_ignore =
lib_deps =
    ${env.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio
board_microros_transport = wifi
board_microros_distro = humble

[env:risky]
extends = microros
build_src_filter = -<*> +<main.cpp> +<telemetry_ros.cpp>

; El mismo firmware sin telemetría, para compilar y probar en Windows.
[env:risky_manual]
build_src_filter = -<*> +<main.cpp> +<telemetry_off.cpp>

[env:bench_rc]
build_src_filter = -<*> +<bench_rc.cpp>

[env:bench_drive]
build_src_filter = -<*> +<bench_drive.cpp>

[env:bench_esc]
build_src_filter = -<*> +<bench_esc.cpp>

[env:bench_thrust]
build_src_filter = -<*> +<bench_thrust.cpp>

[env:bench_i2c]
build_src_filter = -<*> +<bench_i2c.cpp>

[env:bench_imu]
build_src_filter = -<*> +<bench_imu.cpp>

[env:bench_imu_driver]
build_src_filter = -<*> +<bench_imu_driver.cpp>

[env:bench_tof]
build_src_filter = -<*> +<bench_tof.cpp>

[env:bench_ros]
extends = microros
build_src_filter = -<*> +<bench_ros.cpp>

; ESP32-CAM AI-Thinker, grabada con la placa base ESP32-CAM-MB.
[env:cam]
board = esp32cam
build_src_filter = -<*> +<cam.cpp>
lib_deps =
; Con DTR/RTS activos el monitor deja la ESP32-CAM-MB en reset.
monitor_rts = 0
monitor_dtr = 0
